[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gri-research"
version = "0.1.0"
description = "Geometric Recurrent Intelligence research scaffold and WORLD-0 benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
model = ["torch>=2.0"]
incident = [
    "pandas==3.0.2",
    "pyarrow==25.0.1",
    "scikit-learn==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
