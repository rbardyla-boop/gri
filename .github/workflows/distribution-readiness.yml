name: Distribution Readiness

on:
  push:
    branches: [mechanism-autopsy-external-gate]
  pull_request:
    branches: [main]

jobs:
  wheel-smoke:
    name: wheel-smoke-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel contains only the product package
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = sorted(zf.namelist())
          forbidden = [
              name for name in names
              if name.startswith(('dmc', 'gri_models/', 'gri_world0/'))
          ]
          assert not forbidden, forbidden
          package_files = [name for name in names if name.startswith('gauntlet/')]
          assert package_files, names
          assert any(name.endswith('gauntlet/cli.py') for name in names)
          assert any('.dist-info/' in name for name in names)
          print(f'wheel_files={len(names)} gauntlet_files={len(package_files)}')
          PY
      - name: Fresh-install smoke test outside repository
        run: |
          python -m venv /tmp/gri-gauntlet-smoke
          /tmp/gri-gauntlet-smoke/bin/python -m pip install --upgrade pip
          /tmp/gri-gauntlet-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/gri-gauntlet-smoke/bin/python -m pip check
          /tmp/gri-gauntlet-smoke/bin/gri-gauntlet --version
          /tmp/gri-gauntlet-smoke/bin/gauntlet --version
          /tmp/gri-gauntlet-smoke/bin/python -m gauntlet --version
          cat > /tmp/claim.md <<'EOF'
          # Example

          | System | Score |
          | --- | ---: |
          | A | 2 |
          | B | 1 |
          EOF
          /tmp/gri-gauntlet-smoke/bin/gri-gauntlet draft-markdown /tmp/claim.md \
            --output /tmp/draft.json \
            --source-uri https://example.invalid/claim \
            --source-revision demo \
            > /tmp/draft-output.json
          /tmp/gri-gauntlet-smoke/bin/python - <<'PY'
          import json
          draft = json.load(open('/tmp/draft.json'))
          assert draft['authority_status'] == 'HUMAN_APPROVAL_REQUIRED'
          assert draft['table_count'] == 1
          assert draft['boundary']['candidate_not_inferred'] is True
          assert draft['boundary']['credit_decision_not_run'] is True
          PY

  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source test environment
        run: python -m pip install -e '.[test,research]'
      - name: Run Gauntlet and terminal-verdict regression suites
        run: |
          pytest \
            tests/test_gauntlet.py \
            tests/test_gauntlet_manipulations.py \
            tests/test_gauntlet_inspect_adapter.py \
            tests/test_gauntlet_autopsy.py \
            tests/test_gauntlet_claim_draft.py \
            tests/test_project_terminal_verdict.py \
            -q
