name: ERC-0 Evidence Relay

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ERC-RESEARCH-PROGRAM-V0.md'
      - 'experiments/erc0/**'
      - 'tests/test_erc0.py'
      - '.github/workflows/erc0-evidence-relay.yml'
  workflow_dispatch:

jobs:
  mechanism-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile ERC-0
        run: python -m py_compile experiments/erc0/run_erc0.py
      - name: Run ERC-0 regression tests
        run: python -m pytest -q tests/test_erc0.py
      - name: Run registered ERC-0 benchmark once
        run: |
          python -m experiments.erc0.run_erc0 --output /tmp/ERC0_REPORT.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/ERC0_REPORT.json'))
          print('STATUS:', p['status'])
          print('CASE_COUNT:', p['case_count'])
          print('INTEGRITY:', p['integrity'])
          print('SELECTED_CONTROLS:', p['selected_controls'])
          for name, m in p['metrics'].items():
              print(name, 'top1=', m['top1'], 'top3=', m['top3'], 'by_size=', m['by_size'])
          print('COMPRESSION:', p['relay_compression'])
          print('ROWS_SHA256:', p['rows_sha256'])
          print('RECORD_SHA256:', p['record_sha256'])
          PY
      - name: Preserve ERC-0 report
        uses: actions/upload-artifact@v4
        with:
          name: ERC0_REPORT
          path: /tmp/ERC0_REPORT.json
