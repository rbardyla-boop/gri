name: Gauntlet Rescue

on:
  push:
    branches: [gauntlet-rescue-v0]
  pull_request:
    branches: [main]

jobs:
  integrity-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Gauntlet regression, manipulation, and foreign-log tests
        run: |
          pytest \
            tests/test_gauntlet.py \
            tests/test_gauntlet_manipulations.py \
            tests/test_gauntlet_inspect_adapter.py \
            -q
      - name: Preserve project terminal-verdict verifier
        run: pytest tests/test_project_terminal_verdict.py -q
      - name: Retrospective MCO-05 self-audit
        run: |
          python -m gauntlet audit-result \
            examples/gauntlet/mco05_retrospective.toml \
            artifacts/mco05/scientific/MCO05_VERDICT.json \
            > /tmp/mco05-audit.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/mco05-audit.json'))
          assert value['evidence_class'] == 'RETROSPECTIVE_AUDIT'
          assert value['state'] == 'NO_ESTABLISHED_ADVANTAGE'
          assert value['comparison']['pass'] is True
          assert value['required_gates_pass'] is False
          PY
      - name: End-to-end frozen demo
        run: |
          gauntlet freeze examples/gauntlet/demo.toml
          gauntlet verify .gauntlet/freeze.json
          gauntlet run .gauntlet/freeze.json --run-id live > /tmp/live.json
          gauntlet replay .gauntlet/freeze.json .gauntlet/runs/live.json --run-id replay > /tmp/replay.json
          gauntlet verdict \
            .gauntlet/freeze.json \
            .gauntlet/runs/live.json \
            --replay .gauntlet/replays/replay.json \
            > /tmp/verdict.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/verdict.json'))
          assert value['evidence_class'] == 'PREREGISTERED_RUN'
          assert value['state'] == 'ADVANCE'
          assert all(value['integrity'].values())
          PY
      - name: Generate and audit a real Inspect AI log
        run: |
          python -m pip install 'inspect-ai==0.3.257'
          rm -rf /tmp/inspect-logs /tmp/inspect-run.json /tmp/inspect-audit.json
          inspect eval examples/gauntlet/inspect_foreign_eval.py \
            --model mockllm/model \
            --log-format json \
            --log-dir /tmp/inspect-logs \
            --display none
          LOG="$(find /tmp/inspect-logs -type f -name '*.json' | head -n 1)"
          test -n "$LOG"
          inspect log export-config "$LOG" --format json --output /tmp/inspect-run.json
          gauntlet audit-inspect "$LOG" --run-config /tmp/inspect-run.json > /tmp/inspect-audit.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/inspect-audit.json'))
          assert value['adapter'] == 'inspect_ai_json'
          assert value['evidence_class'] == 'FOREIGN_LOG_AUDIT'
          assert value['classification'] == 'FOREIGN_LOG_STRUCTURALLY_STRONG'
          assert value['concerns'] == []
          assert value['evidence']['successful_completion']['status'] == 'VERIFIED_FROM_LOG'
          assert value['evidence']['run_config_artifact']['status'] == 'VERIFIED_FROM_LOG'
          assert value['evidence']['dataset_content_identity']['status'] == 'NOT_ESTABLISHED'
          assert value['evidence']['holdout_isolation']['status'] == 'NOT_ESTABLISHED'
          assert value['evidence']['preregistration']['status'] == 'NOT_ESTABLISHED'
          assert value['boundary']['claim_admissibility'] == 'NOT_ESTABLISHED'
          PY
