name: Wildflower pre-lock

on:
  pull_request:
    paths:
      - "experiments/wildflower0_prelock/**"
      - ".github/workflows/wildflower-prelock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prelock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/wildflower0_prelock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile
        run: |
          python -m compileall -q wildflower0 tests run_shakeout.py run_variant_probe.py run_recurrent_probe.py run_nursery1_probe.py
      - name: Unit tests with warnings as errors
        run: python -m pytest -q -W error
      - name: Static dependency and style checks
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {"transformers", "tiktoken", "openai", "whisper", "clip", "llama_cpp"}
          imports = set()
          findings = []
          paths = [*Path("wildflower0").rglob("*.py"), *Path("tests").rglob("*.py")]
          paths += list(Path(".").glob("run_*probe.py")) + [Path("run_shakeout.py")]
          for path in paths:
              text = path.read_text()
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.add(node.module.split(".")[0])
              for line_no, line in enumerate(text.splitlines(), 1):
                  if "\t" in line or line.rstrip() != line or len(line) > 120:
                      findings.append((str(path), line_no, len(line)))
          bad_imports = sorted(forbidden & imports)
          if bad_imports or findings:
              raise SystemExit(f"forbidden_imports={bad_imports} style_findings={findings}")
          print("static checks: PASS")
          PY
      - name: Nursery-1 deterministic smoke
        run: |
          python - <<'PY'
          import numpy as np
          import torch
          from wildflower0.nursery1 import DominanceResidual, collect_pairs, state_mae, velocity_baseline_mae

          pairs = collect_pairs(321, 96)
          model = DominanceResidual()
          candidate = state_mae(model, pairs, 1, burn=5)
          baseline = velocity_baseline_mae(pairs, 1, burn=5)
          assert np.isfinite(candidate) and np.isfinite(baseline)
          assert all(torch.isfinite(p).all() for p in model.parameters())
          print("nursery1 smoke: PASS")
          PY
