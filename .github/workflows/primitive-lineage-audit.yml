name: PRIMITIVE lineage static audit

on:
  push:
    branches:
      - wildflower-0-prelock-shakeout
    paths:
      - "experiments/wildflower0_prelock/inspect_primitive_lineage.py"
      - ".github/workflows/primitive-lineage-audit.yml"
      - "PRIMITIVE-*.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspect all PRIMITIVE archives without executing them
        working-directory: experiments/wildflower0_prelock
        run: python inspect_primitive_lineage.py
      - uses: actions/upload-artifact@v4
        with:
          name: primitive-lineage-static-audit
          path: experiments/wildflower0_prelock/artifacts/primitive_lineage_static_audit.json
          if-no-files-found: error
