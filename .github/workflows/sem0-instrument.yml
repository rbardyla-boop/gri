name: SEM-0 Instrument

on:
  push:
    branches: [sem-0-meaning-before-mind]
  pull_request:
    branches: [main]

jobs:
  instrument-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Run SEM-0 instrument and model-preflight tests
        run: |
          pytest \
            tests/test_sem0_instrument.py \
            tests/test_sem0_model_preflight.py \
            -q
      - name: Regenerate and verify frozen synthetic instrument hashes
        run: |
          rm -rf /tmp/sem0
          mkdir -p /tmp/sem0/scorer_only
          python experiments/sem0/generate_sem0.py \
            --cases /tmp/sem0/SEM0_CASES.jsonl \
            --gold /tmp/sem0/scorer_only/SEM0_GOLD.jsonl
          python experiments/sem0/make_replay_subset.py \
            --cases /tmp/sem0/SEM0_CASES.jsonl \
            --output /tmp/sem0/SEM0_REPLAY_CASES.jsonl
          printf '%s  %s\n' \
            74be062f249dabea4a2fef2aa5837438dcff8bd03115cff993e607dd398262f2 \
            /tmp/sem0/SEM0_CASES.jsonl \
            > /tmp/sem0/SHA256SUMS
          printf '%s  %s\n' \
            01a4bee6a7ad70fa93f96a10fc4e5b5e62a86a3fb8e653b1af55c7c61b573aa0 \
            /tmp/sem0/scorer_only/SEM0_GOLD.jsonl \
            >> /tmp/sem0/SHA256SUMS
          printf '%s  %s\n' \
            cc091f871755b80c52e767c8d39a878aa2944f5080bed6b5c0531ddadb449906 \
            /tmp/sem0/SEM0_REPLAY_CASES.jsonl \
            >> /tmp/sem0/SHA256SUMS
          sha256sum -c /tmp/sem0/SHA256SUMS
      - name: Preserve canonical project terminal verdict
        run: pytest tests/test_project_terminal_verdict.py -q
      - name: Validate SEM-0 model binding state
        run: |
          grep -q 'TO_BE_BOUND' experiments/sem0/SEM0_MODEL_IDENTITY.example.json
          if test -e experiments/sem0/SEM0_MODEL_IDENTITY.json; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path('experiments/sem0/SEM0_MODEL_IDENTITY.json')
          value = json.loads(p.read_text(encoding='utf-8'))
          assert value['status'] == 'SEM0_MODEL_PREFLIGHT_PASS'
          assert value['scientific_run_authorized'] is False
          assert value['model_id'] == 'llama3.1:8b'
          assert value['artifact_sha256'] == '667b0c1932bc6ffc593ed1d03f895bf2dc8dc6df21db3042284a6f4416b06a29'
          assert value['ollama_version'] == '0.21.2'
          assert value['runtime'] == 'ollama-0.21.2-openai-compatible'
          assert value['base_url'] == 'http://127.0.0.1:11434/v1'
          checks = value['checks']
          assert checks['model_name_exact'] is True
          assert checks['historical_blob_exact'] is True
          assert checks['historical_runtime_exact'] is True
          assert checks['tag_digest_present'] is True
          assert value['historical_source']['path'] == 'experiments/mco05/MCO05_CONFIG.json'
          print('SEM0 model identity is exact historical binding; scientific run remains unauthorized')
          PY
          else
            echo 'SEM0 model identity not yet bound; scientific run remains unauthorized'
          fi
